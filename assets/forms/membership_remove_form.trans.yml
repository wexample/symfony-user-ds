en:
  action:
    submit: Remove from the group
  error:
    refused:
      group_not_administered: This group is not yours to administer.
      already_member: This member already belongs to the group.
      invalid_grants: Give at least one access.
      last_administrator: The group would be left with nobody administering it.
  success:
    message: Member removed.

fr:
  action:
    submit: Retirer du groupe
  error:
    refused:
      group_not_administered: Ce groupe n'est pas le vôtre à administrer.
      already_member: Ce membre fait déjà partie du groupe.
      invalid_grants: Donnez au moins un accès.
      last_administrator: Le groupe resterait sans personne pour l'administrer.
  success:
    message: Membre retiré.

zh:
  action:
    submit: 从小组中移除
  error:
    refused:
      group_not_administered: 该小组不是你管理的。
      already_member: 该成员已经属于该小组。
      invalid_grants: 至少提供一个访问权限。
      last_administrator: 小组将没有人管理。
  success:
    message: 成员已移除。

ar:
  action:
    submit: 'إزالة من المجموعة'
  error:
    refused:
      group_not_administered: 'هذه المجموعة ليست تحت إدارتك.'
      already_member: 'هذا العضو بالفعل ينتمي إلى المجموعة.'
      invalid_grants: 'يجب إعطاء حق وصول واحد على الأقل.'
      last_administrator: 'ستبقى المجموعة بدون أي شخص يديرها.'
  success:
    message: 'تمت إزالة العضو.'
