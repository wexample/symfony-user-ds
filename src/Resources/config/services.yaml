services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyUserDs\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']

    Wexample\SymfonyUserDs\Twig\:
        resource: '../../Twig/'

    Wexample\SymfonyUserDs\DevMenu\:
        resource: '../../DevMenu/'

    Wexample\SymfonyUserDs\Form\:
        resource: '../../Form/'

    Wexample\SymfonyUserDs\Service\:
        resource: '../../Service/'
        exclude:
            - '../../Service/FormProcessor/Abstract*.php'
